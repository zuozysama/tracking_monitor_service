version: "3.9"

services:
  cc_cm_tracking_monitor_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc_cm_tracking_monitor_service:latest
    container_name: cc_cm_tracking_monitor_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DDS_MODE: "mock"
      DDS_CONFIG_PATH: "config/dds_settings.yaml"
      FFMPEG_BIN: "ffmpeg"
      MEDIA_OUTPUT_DIR: "/app/media"
      MEDIA_RTSP_URL: "rtsp://admin:1qaz2wsx,.@172.16.10.114:544/Streaming/Chanals/101"
    volumes:
      - ./artifacts/media:/app/media
